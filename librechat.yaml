---
# For more information, see the Configuration Guide:
# https://docs.librechat.ai/install/configuration/custom_config.html

# Configuration version (required)
version: 1.1.7

# Cache settings: Set to true to enable caching
cache: true

includedTools: ['dalle']

interface:
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true


registration:
  socialLogins: ["google"]
  allowedDomains:
    - "networkninja.com"
    - "legalserver.org"
    - "contractor.networkninja.com"

# Definition of custom endpoints
fileConfig:
  endpoints:
    assistants:
      fileLimit: 5000
      fileSizeLimit: 512
      totalSizeLimit: 512
      supportedMimeTypes: 
        - "image/.*"
        - "application/.*"
        - "text/.*"
        - "video/.*"
    openAI:
      disabled: true
    azureOpenAI:
      disabled: false
    default:
      totalSizeLimit: 512
      supportedMimeTypes:
        - "image/.*"
        - "application/.*"
        - "text/.*"
  serverFileSizeLimit: 512
  avatarSizeLimit: 4
rateLimits:
  fileUploads:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 100
    userWindowInMinutes: 60
  stt:
    userMax: 10
    userWindowInMinutes: 1
  tts:
    userMax: 45
    userWindowInMinutes: 1
endpoints:
  agents:
    disableBuilder: false
    capabilities: ["execute_code", "file_search", "tools"]
  azureAssistants:
    disableBuilder: false
    privateAssistants: true
    pollIntervalMs: 500
    timeoutMs: 10000
    capabilities: ["code_interpreter"]

  custom:
    - name: "NNI Models"
      apiKey: "YOUR-LITELLM-API-KEY-HERE"
      baseURL: "https://aimlapi-dev.networkninja.com/v1"
      models:
        default: ["gpt-4.1-mini"]
        fetch: true
      titleConvo: true
      titleModel: "gpt-4.1-mini"
      modelDisplayLabel: "NetworkNinja LLMs"

mcpServers:
  brave-search:
    type: stdio
    command: npx
    args:
      - -y
      - "@brave/brave-search-mcp-server"
      - "--transport"
      - "stdio"
      - "--enabled-tools"
      - "brave_web_search"
      - "brave_news_search"
    env:
      BRAVE_API_KEY: "YOUR-BRAVE-API-KEY-HERE"
    timeout: 60000
    initTimeout: 15000
  google-grounding:
    type: "streamable-http"
    url: "https://mapstools.googleapis.com/mcp"
    headers:
      X-Goog-Api-Key: "YOUR-GOOGLE-MAPS-API-KEY-HERE"
    timeout: 60000
    initTimeout: 15000
